[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-grpo"
version = "0.1.0"
description = "Element-aware group learning for e-commerce image optimization"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "PyYAML>=6", "requests>=2.31", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
train = ["transformers>=4.57.1,<5", "trl==1.6.0", "peft==0.19.1", "accelerate>=1.4", "datasets>=4.7", "qwen-vl-utils>=0.0.14", "openai>=1.40", "torchvision", "safetensors", "tqdm"]
vllm = ["vllm==0.13.0"]
flux = ["diffusers>=0.38", "transformers>=4.57.1,<5", "accelerate>=1.4", "sentencepiece"]
parquet = ["pandas>=2", "pyarrow>=15"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grpo*", "sft*", "utils*", "prompts*", "rewards*", "weight_head*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
