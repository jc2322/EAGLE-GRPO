model:
  model_name_or_path: ./models/sft_merged
  sft_adapter_path: null
  apply_schema_token_rows: false
  vllm_materialize_expanded_model: false
  vllm_expanded_model_cache_dir: ./work/vllm_expanded_models
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: false
  load_in_8bit: false
  device_map: false
  move_to_cuda: true
lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
data:
  train_csv: ./data/grpo/train.csv
  image_column: original_image_url
  item_id_column: item_id
  title_column: title
  description_column: description
  category_column: category_l1
  region_column: market
  image_cache_dir: ./work/image_cache
  image_timeout_seconds: 30
  image_max_pixels: 1048576
  max_samples: 2000
  system_prompt: |-
    You are a design-planning VLM for e-commerce product main-image optimization.
    Given the original product image, title, description, category, and marketplace region, generate one prompt plan for GPT-Image-2.

    Output exactly one concise natural-language <thinking> block followed by one structured <final_prompt> block.

    Core design policy:
    - Preserve the real product identity, count, shape, packaging, logos, visible source text, and grounded commercial information.
    - Improve the main image through cleaner hierarchy, typography, composition, background, lighting, and product presentation.
    - Treat the description as an optional information pool, not a checklist. It is often best to use only the title and source image when extra facts would clutter the main image.
    - Prefer clean/minimal-to-balanced designs. A richer design is allowed only when the product image and grounded facts genuinely support it and the result remains readable.
    - Do not fill optional tags just because the schema has them. Empty optional tags are normal and often correct.
    - Multiple valid designs may exist for the same product. Choose one coherent design by varying information selection, optional element activation, layout hierarchy, supporting-visual intensity, text density, scene/style treatment, and visual treatment of active elements.

    <thinking> requirements:
    - 70-120 words when possible.
    - Mention what product is visible, which title/description/source-image facts are worth showing, which facts should be dropped, why the layout/style fits, and key risk controls.
    - Keep it as a decision summary. Do not copy detailed final-prompt sentences.

    <final_prompt> requirements:
    - Emit every schema tag exactly once and in this order:
      <preservation_constraints>, <product_presentation>, <headline>, <subtitle>,
      <feature_callouts>, <specification_information>, <quantity_bundle_information>,
      <variant_information>, <price_promotion_information>, <seller_logistics_information>,
      <trust_information>, <usage_information>, <comparison_visual>, <supporting_visuals>,
      <composition_layout>, <scene_style>, <lighting_rendering>, <negative_constraints>.
    - Required tags must be non-empty: preservation_constraints, product_presentation, headline, composition_layout, scene_style, lighting_rendering, negative_constraints.
    - Optional tags may be empty: subtitle, feature_callouts, specification_information, quantity_bundle_information, variant_information, price_promotion_information, seller_logistics_information, trust_information, usage_information, comparison_visual, supporting_visuals.
    - Target 260-430 words total for <final_prompt> when possible.
    - Required global tags should stay concise. Each active optional tag should usually be one executable action sentence.
    - If an optional tag is non-empty, do not write only a fact label. Include the exact visible text or fact plus visual form, placement, typography/hierarchy, and color/style when relevant.
    - Example good optional element: Render "115年4月最新版" as a small dark-gray secondary line directly below the headline, regular weight, with generous spacing and no badge.

    Optional tag semantics:
    - <subtitle>: short support line only when it adds clarity; if active, specify exact text, placement, size, hierarchy, and whether it is plain text or a badge/card.
    - <feature_callouts>: compact 1-2 benefit/material/function callouts; if active, specify exact callout text, form, placement, and visual hierarchy.
    - <specification_information>: concrete specs such as capacity, size, material, model, voltage, dimensions; if active, specify exact text plus badge/card/plain-text treatment and placement.
    - <quantity_bundle_information>: pack size, set count, bundle contents, net weight, included accessories; if active, specify exact text plus compact visual treatment.
    - <variant_information>: color, size, flavor, model/storage options, visible variant strip; if active, specify swatch/chip/text-row form.
    - <price_promotion_information>: price, discount, voucher, gift, promo only when grounded and safe; if active, specify form and priority.
    - <seller_logistics_information>: local stock, shipping, preorder, seller/store info only when grounded; if active, specify footer/header strip or small trust-mark treatment.
    - <trust_information>: warranty, certification, original/authentic, rating/review only when grounded; if active, specify badge/label form, placement, and restrained hierarchy.
    - <usage_information>: usage steps or how-to only when grounded and safe; if active, specify step-card/mini-sequence form and placement.
    - <comparison_visual>: before/after or comparison panel only when clearly supported; if active, specify panel structure and labels.
    - <supporting_visuals>: zoom/detail/package/accessory/source inset only when clearly useful; if active, specify visual object, inset/card form, placement, and relationship to the product.
  user_template: |-
    Marketplace region: {grass_region}
    Product title: {title}
    Product description: {description}
    Product category: {category}

    Produce one faithful, commercially clean design plan. Select only the information that should visibly improve the main image; leave optional schema tags empty when they are not useful.
  market_column: market
  category_l1_column: category_l1
generation:
  num_generations: 20
  max_prompt_length: 8192
  max_completion_length: 2048
  temperature: 0.9
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.05
  use_vllm: true
  vllm_importance_sampling_correction: false
  vllm_mode: colocate
  vllm_tensor_parallel_size: 1
  vllm_gpu_memory_utilization: 0.2
  vllm_max_model_length: 8192
  vllm_enable_sleep_mode: true
  vllm_server_base_url: null
reward:
  provider: online_component
  strategy: rewards.strategy.DecoupledCotImageRewardStrategy
  advantage_provider: utils.element_kernel_advantage.ElementKernelAdvantageProvider
element_credit:
  embedding_backend: hidden_states
  hidden_state_fallback: hashed_ngram
  hidden_state_batch_size: 1
  token_delta_epsilon: 1.0e-06
  embedding_dim: 256
  min_ngram: 1
  max_ngram: 2
  normalize_embeddings: true
  lambda_reg: 0.1
  eta: 0.5
  include_thinking: true
online_reward:
  temperature: 0.0
  cot_worker_count: 1
  image_worker_count: 1
  judge_worker_count: 4
  cot_max_completion_tokens: 1400
  image_max_completion_tokens: 2200
  chat_image_format: image_url
  judge:
    backend: openai_compatible
    model: gemini-2.5-flash
    base_url_env: JUDGE_BASE_URL
    api_key_env: JUDGE_API_KEY
    response_format_json: true
    timeout: 300
  cot_judge:
    max_new_tokens: 1400
  image_judge:
    max_new_tokens: 2200
    resize_inputs: true
    resize_max_side: 1024
    cleanup_resized_inputs: true
  schema_invalid_reward: 0.0
  save_generated_images: false
  rollout_group:
    min_successful_samples: 18
    min_successful_ratio: 0.75
  scalar_logging_weights:
    cot: 0.1
    image: 0.9
  image_edit:
    provider: flux2_klein
    backend: external_worker
    worker_script: ./utils/image_edit_worker.py
    worker_timeout: 600
    model: FLUX.2-klein-9B
    model_path: black-forest-labs/FLUX.2-klein-9B
    torch_dtype: bfloat16
    device: cuda
    enable_model_cpu_offload: false
    disable_xformers: true
    size: 1024x1024
    output_format: png
    n: 1
    seed: 0
    num_inference_steps: 4
    guidance_scale: 1.0
    size_multiple: 16
    request_timeout: 300
    image_download_timeout: 60
  cot_reward_weights:
    source_understanding: 0.12
    grounded_fact_selection: 0.3
    risk_control: 0.3
    design_rationale: 0.22
    efficiency: 0.04
    non_redundancy: 0.02
training:
  output_dir: ./outputs/grpo_flux
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 80
  generation_batch_size: 80
  max_steps: 270
  learning_rate: 1.0e-06
  weight_decay: 0.0
  warmup_steps: 5
  lr_scheduler_type: constant
  max_grad_norm: 1.0
  loss_type: dapo
  scale_rewards: group
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  num_iterations: 1
  importance_sampling_level: token
  mask_truncated_completions: true
  logging_steps: 1
  save_steps: 10
  save_total_limit: 50
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  disable_dropout: true
  report_to: none
  log_completions: false
weight_head:
  checkpoint: ./outputs/weight_head/finetune.pt
  unknown_context: error
  denominator_epsilon: 1.0e-08
